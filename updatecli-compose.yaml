name: Default Policies

valuesinline:
  scm:
    enabled: true
    email: bot@updatecli.io
    user: updatecli
    owner: updatecli
    repository: releasepost
    username: "updatecli-bot"
    branch: main

policies:
  - name: Update golangci-lint
    policy: ghcr.io/updatecli/policies/golangci-lint/githubaction:0.9.0@sha256:caccf9fe8fd42ffb113bf949cdf00f0bace80df1e59eadbd3cfcfbbfe5271161

  - name: Updatecli GitHub action
    policy: ghcr.io/updatecli/policies/autodiscovery/githubaction:0.5.0@sha256:7dd97c132950994dc3fb89e0bc77037358e9168d8e6980705b2a06e444270626

  - name: Update Updatecli policies
    policy: ghcr.io/updatecli/policies/updatecli/autodiscovery:0.9.0@sha256:67026697434a99f6e01a662caa662e8ed02e39e8abf8f7399ab673d113abb360
    valuesinline:
      pipeline:
        labels:
          ecosystem: "updatecli"
          monitor: active

  - name: Update Updatecli version in GitHub action
    policy: ghcr.io/updatecli/policies/updatecli/githubaction:0.10.0@sha256:666a807c7e1f260fa3d9357fd2b60c57f5dedbd6f29f97b6f82d882ed4058608
    valuesinline:
      pipeline:
        labels:
          ecosystem: "updatecli"
          monitor: active

  - name: Golang Version
    policy: ghcr.io/updatecli/policies/golang/version:0.9.0@sha256:4ebf4c09d559ba1dcdd64b6f5749b4e0d7e473adef2f4805f85bc1a0f0795aa6

  - name: Major Golang Module update
    policy: ghcr.io/updatecli/policies/autodiscovery/golang:0.14.0@sha256:dcca03ce07083bd34140d85ad2e1317ef6f40ea258f2b3c67edf3823a25d303f
    valuesinline:
      name: "deps(golang): Bump Major version for Golang module"
      pipelineid: "golang/gomod/major"
      groupby: all
      spec:
        versionfilter:
          kind: semver
          pattern: majoronly
        ignore:
          - modules:
              # Ignoring the following modules as they do not publish release
              github.com/shurcooL/githubv4: ""
        only:
          # This repository contains other go.sum file used for testing.
          # So we want to be sure that we only update the one at the root of the repository
          - path: "go.mod"

  - name: Minor Golang Module update
    policy: ghcr.io/updatecli/policies/autodiscovery/golang:0.14.0@sha256:dcca03ce07083bd34140d85ad2e1317ef6f40ea258f2b3c67edf3823a25d303f
    valuesinline:
      name: "deps(golang): Bump Minor version for Golang module"
      pipelineid: "golang/gomod/minor"
      groupby: individual

      spec:
        versionfilter:
          kind: semver
          pattern: minoronly
        ignore:
          - modules:
              # Ignoring the following modules as they do not publish release
              github.com/shurcooL/githubv4: ""
        only:
          # This repository contains other go.sum file used for testing.
          # So we want to be sure that we only update the one at the root of the repository
          - path: "go.mod"

  - name: Patch Golang Module update
    policy: ghcr.io/updatecli/policies/autodiscovery/golang:0.13.1@sha256:85a008b9760fc02b05f68f4047d53b7c05f7250d5a8e8e7da33e925c72c885e0
    valuesinline:
      name: "deps: bump patch version for Golang module"
      pipelineid: "golang/gomod/patch"

      spec:
        versionfilter:
          kind: semver
          pattern: patch
        ignore:
          - modules:
              # Ignoring the following modules as they do not publish release
              github.com/shurcooL/githubv4: ""
        only:
          # This repository contains other go.sum file used for testing.
          # So we want to be sure that we only update the one at the root of the repository
          - path: "go.mod"

  - name: Configure Updatecli workflows
    id: updatecli
    policy: ghcr.io/updatecli/policies/updatecli/githubaction/scaffold:0.1.1@sha256:121dfef5a33bc5cad4eced09ae1fd2305319ce2fd6d23ff661b5c99d11d0d9d2
    valuesinline:
      gha:
        golang:
          enabled: true
        udash:
          enabled: true
        update:
          cron: "0 3 * * *"
          matrix:
            - target_name: "existing pipelines"
              apply_args: "--existing-only=true"
            - target_name: "monitored pipelines"
              apply_args: "--labels=monitor:active"
      pipeline:
        labels:
          ecosystem: "updatecli"
          policy: scaffold
          monitor: active
